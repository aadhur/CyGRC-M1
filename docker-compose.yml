# Starts local development backend: PostgreSQL (Database), Valkey (Cache), Keycloak (Auth), and MinIO (File Storage) 

services:
  postgres:
    image: postgres:16-alpine
    container_name: cygrc-postgres
    environment:
      POSTGRES_USER: grc_user
      POSTGRES_PASSWORD: grc_local_password_123
      POSTGRES_DB: grc_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_user -d grc_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.8-alpine
    container_name: cygrc-cache
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: cygrc-auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_123 
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/grc_platform
      KC_DB_USERNAME: grc_user
      KC_DB_PASSWORD: grc_local_password_123
    command: start-dev --http-port 8080 --import-realm
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cygrc-storage
    ports:
      - "9000:9000" #S3 API port
      - "9001:9001" #Web console UI port
    environment:
      MINIO_ROOT_USER: minio_local_admin
      MINIO_ROOT_PASSWORD: minio_local_password_123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  cygrc-storage-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: cygrc-storage-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      minio_local_admin minio_local_password_123;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      echo 'MinIO is available.';
      mc mb --ignore-existing local/cygrc-evidence;
      mc anonymous set download local/cygrc-evidence;
      echo 'cygrc-evidence bucket is ready.';
      "
  backend:
    build: ./backend/core  
    ports:
      - "8000:8000"
    command: >
      sh -c "DATABASE_URL=postgresql+asyncpg://grc_user:grc_local_password_123@postgres:5432/grc_platform alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/core/app:/app/app
    environment:
    
      - VALKEY_URL=redis://valkey:6379/0
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - DATABASE_URL=postgresql+asyncpg://grc_app_test:test_password_123@postgres:5432/grc_platform
      - MINIO_ENDPOINT=http://minio:9000
      - SLM_ENDPOINT_URL=${SLM_ENDPOINT_URL}
      - MINIO_ACCESS_KEY=minio_local_admin
      - MINIO_SECRET_KEY=minio_local_password_123
      - MINIO_BUCKET=cygrc-evidence
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_password_123

    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
      build: ./frontend
      container_name: cygrc-frontend
      ports:
        - "3000:3000"
      volumes:
        - ./frontend:/app
        - /app/node_modules
        - /app/.next
      environment:
        - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
        - NEXT_PUBLIC_KEYCLOAK_BASE_URL=http://localhost:8080
        - NEXT_PUBLIC_KEYCLOAK_REALM=cyart-platform
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=cygrc-app
        - NEXT_PUBLIC_APP_URL=http://localhost:3000
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      depends_on:
        - backend


volumes:
  pgdata:
  valkeydata:
  miniodata:

